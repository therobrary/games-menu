<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Robrary AI Games Library - A collection of retro arcade games built with AI codegen tools">
    <title>Robrary AI Games Library</title>
    <style>

        :root {
            --phosphor-primary: #00ff41;
            --phosphor-dim: #00cc33;
            --phosphor-glow: #00ff4180;
            --phosphor-subtle: #00661a;
            --crt-bg: #000a00;
            --crt-surface: #001200;
            --amber-accent: #ffaa00;
            --amber-dim: #cc8800;
            --amber-glow: #ffaa0066;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--crt-bg);
            color: var(--phosphor-primary);
            font-family: 'Courier New', Courier, 'Lucida Sans Typewriter', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 2rem;
            background-image:
                linear-gradient(rgba(0, 102, 26, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 102, 26, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(
                0deg, transparent, transparent 3px,
                rgba(0, 0, 0, 0.4) 3px, rgba(0, 0, 0, 0.4) 6px
            );
            pointer-events: none;
            z-index: 9999;
            animation: scanline-drift 8s linear infinite;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at center, transparent 60%, rgba(0, 5, 0, 0.6) 100%);
            pointer-events: none;
            z-index: 9998;
        }

        .crt-sweep {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100px;
            background: linear-gradient(to bottom, transparent, rgba(0, 255, 65, 0.03), transparent);
            pointer-events: none;
            z-index: 9997;
            animation: scanline-sweep 6s linear infinite;
        }

        .starfield {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            border-radius: 50%;
            background: var(--phosphor-dim);
            animation: star-twinkle 3s ease-in-out infinite;
        }

        .boot-sequence {
            position: relative;
            z-index: 1;
            margin-bottom: 2rem;
            animation: boot-fadeout 0.8s ease-out 3s forwards;
            animation-fill-mode: both;
        }

        .boot-line {
            color: var(--phosphor-subtle);
            font-size: 0.75rem;
            line-height: 1.6;
            animation: boot-typing 3s steps(45) both;
            overflow: hidden;
            white-space: nowrap;
            width: 0;
        }

        .boot-line:nth-child(1) { animation-delay: 0s; }
        .boot-line:nth-child(2) { animation-delay: 0.8s; }
        .boot-line:nth-child(3) { animation-delay: 1.6s; }
        .boot-line:nth-child(4) { animation-delay: 2.4s; }

        .page-content {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 2.5rem;
            text-align: center;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 6px;
            color: var(--phosphor-primary);
            text-shadow:
                0 0 5px var(--phosphor-glow),
                0 0 10px var(--phosphor-glow),
                0 0 20px var(--phosphor-glow),
                0 0 40px var(--phosphor-glow),
                -1px 0 2px rgba(255, 0, 0, 0.15),
                0 0 2px rgba(0, 255, 0, 0.3),
                1px 0 2px rgba(0, 0, 255, 0.15);
            animation: title-flicker 4s ease-in-out infinite, title-glow-breathe 3s ease-in-out infinite;
        }

        p.subtitle {
            font-size: 1rem;
            text-align: center;
            margin-bottom: 2rem;
            color: var(--phosphor-dim);
            text-shadow: 0 0 2px var(--phosphor-glow);
            letter-spacing: 2px;
        }

        .cursor {
            display: inline-block;
            color: var(--phosphor-primary);
            animation: cursor-blink 0.8s step-end infinite;
            margin-left: 2px;
        }

        .pixel-divider {
            width: 100%;
            height: 4px;
            border: none;
            background: repeating-linear-gradient(
                90deg,
                var(--phosphor-subtle) 0px, var(--phosphor-subtle) 4px,
                transparent 4px, transparent 8px
            );
            margin: 1rem 0;
            box-shadow: 0 0 4px var(--phosphor-glow);
        }

        .footer {
            position: relative;
            z-index: 1;
            text-align: center;
            margin-top: 3rem;
        }

        .press-start {
            color: var(--amber-accent);
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 8px var(--amber-glow), 0 0 16px var(--amber-glow);
            animation: press-start-blink 1.2s step-end infinite;
            margin-top: 0.5rem;
        }

        .copyright {
            color: var(--phosphor-subtle);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-top: 0.5rem;
        }

        .games-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
            width: 100%;
            max-width: 900px;
        }

        .game-card {
            border: 2px solid var(--phosphor-dim);
            border-radius: 0;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: var(--phosphor-primary);
            transition: all 0.3s ease;
            box-shadow: 0 0 5px var(--phosphor-glow), inset 0 0 8px rgba(0, 255, 65, 0.08);
            background-color: var(--crt-surface);
            position: relative;
            min-height: 280px;
        }

        .game-card:hover {
            border-color: var(--amber-dim);
            box-shadow: 0 0 15px var(--amber-glow), inset 0 0 15px rgba(255, 170, 0, 0.15);
            background-color: rgba(255, 170, 0, 0.05);
            transform: translateY(-6px) scale(1.02);
            color: var(--amber-accent);
        }

        .card-corner {
            position: absolute;
            width: 12px; height: 12px;
            border-color: var(--phosphor-subtle);
            border-style: solid;
            transition: border-color 0.3s ease;
        }

        .card-corner.tl { top: 4px; left: 4px; border-width: 2px 0 0 2px; }
        .card-corner.tr { top: 4px; right: 4px; border-width: 2px 2px 0 0; }
        .card-corner.bl { bottom: 4px; left: 4px; border-width: 0 0 2px 2px; }
        .card-corner.br { bottom: 4px; right: 4px; border-width: 0 2px 2px 0; }

        .game-card:hover .card-corner { border-color: var(--amber-dim); }

        .sprite {
            width: 96px; height: 96px;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            image-rendering: pixelated;
            filter: brightness(1);
            transition: filter 0.3s ease;
        }

        .sprite svg {
            width: 96px; height: 96px;
            shape-rendering: crispEdges;
        }

        .game-card:hover .sprite { filter: brightness(1.4); }

        .game-card:hover .sprite-snake {
            animation: snake-slither 0.8s ease-in-out infinite alternate, sprite-bob 0.6s ease-in-out infinite alternate;
        }
        .game-card:hover .sprite-missile {
            animation: sprite-bob 0.6s ease-in-out infinite alternate;
        }
        .game-card:hover .sprite-defender {
            animation: sprite-bob 0.6s ease-in-out infinite alternate, defender-bank 0.6s ease-in-out infinite alternate;
        }
        .game-card:hover .sprite-invader {
            animation: alien-march 0.4s steps(1) infinite, sprite-bob 0.6s ease-in-out infinite alternate;
        }

        h2 {
            font-size: 1.8rem;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            text-shadow: 0 0 5px var(--phosphor-glow);
            text-align: center;
            letter-spacing: 3px;
            color: var(--phosphor-primary);
            transition: text-shadow 0.3s ease, color 0.3s ease;
        }

        .game-card:hover h2 {
            text-shadow: 0 0 10px var(--amber-glow);
            color: var(--amber-accent);
        }

        .play-btn {
            padding: 0.8rem 2rem;
            border: 1px solid var(--phosphor-dim);
            background-color: transparent;
            color: var(--phosphor-primary);
            font-family: inherit;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            letter-spacing: 2px;
            box-shadow: 0 0 3px var(--phosphor-glow);
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .game-card:hover .play-btn {
            background-color: var(--amber-accent);
            color: var(--crt-bg);
            border-color: var(--amber-accent);
            box-shadow: 0 0 10px var(--amber-glow);
        }

        .game-card:focus {
            outline: 2px solid var(--amber-accent);
            outline-offset: 4px;
        }

        @keyframes title-flicker {
            0%, 100% { opacity: 1; }
            5% { opacity: 0.94; }
            10% { opacity: 1; }
            15% { opacity: 0.96; }
            20% { opacity: 1; }
            50% { opacity: 0.98; }
            55% { opacity: 1; }
        }

        @keyframes title-glow-breathe {
            0%, 100% {
                text-shadow:
                    0 0 5px var(--phosphor-glow), 0 0 10px var(--phosphor-glow),
                    0 0 20px var(--phosphor-glow), 0 0 40px var(--phosphor-glow),
                    -1px 0 2px rgba(255, 0, 0, 0.15),
                    0 0 2px rgba(0, 255, 0, 0.3),
                    1px 0 2px rgba(0, 0, 255, 0.15);
            }
            50% {
                text-shadow:
                    0 0 8px var(--phosphor-glow), 0 0 15px var(--phosphor-glow),
                    0 0 30px var(--phosphor-glow), 0 0 50px var(--phosphor-glow),
                    -1px 0 3px rgba(255, 0, 0, 0.2),
                    0 0 4px rgba(0, 255, 0, 0.4),
                    1px 0 3px rgba(0, 0, 255, 0.2);
            }
        }

        @keyframes cursor-blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        @keyframes scanline-drift {
            from { transform: translateY(0); }
            to { transform: translateY(6px); }
        }

        @keyframes scanline-sweep {
            from { transform: translateY(-100%); }
            to { transform: translateY(100vh); }
        }

        @keyframes press-start-blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        @keyframes boot-typing {
            from { width: 0; }
            to { width: 100%; }
        }

        @keyframes boot-fadeout {
            from { opacity: 1; }
            to { opacity: 0; }
        }

        @keyframes star-twinkle {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 0.8; }
        }

        @keyframes sprite-bob {
            0% { transform: translateY(0); }
            100% { transform: translateY(-4px); }
        }

        @keyframes snake-slither {
            0% { transform: translateX(-2px); }
            100% { transform: translateX(2px); }
        }

        @keyframes alien-march {
            0% { transform: translateY(0); }
            50% { transform: translateY(2px); }
            100% { transform: translateY(0); }
        }

        @keyframes exhaust-flicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        @keyframes afterburner-pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        @keyframes defender-bank {
            0% { transform: rotate(-2deg); }
            100% { transform: rotate(2deg); }
        }

        .games-container {
            grid-template-columns: 1fr;
            gap: 1rem;
            max-width: 400px;
        }

        .game-card {
            padding: 1rem;
            min-height: 220px;
        }

        .sprite, .sprite svg {
            width: 64px; height: 64px;
        }

        h1 { font-size: 1.6rem; letter-spacing: 3px; }
        h2 { font-size: 1.4rem; }
        .press-start { font-size: 0.9rem; }

        @media (min-width: 600px) {
            .games-container {
                grid-template-columns: repeat(2, 1fr);
                gap: 1.5rem;
                max-width: 700px;
            }
            .game-card {
                padding: 1.5rem;
                min-height: 260px;
            }
            .sprite, .sprite svg {
                width: 80px; height: 80px;
            }
            h1 { font-size: 2rem; }
            h2 { font-size: 1.6rem; }
        }

        @media (min-width: 1024px) {
            body { padding: 3rem 2rem; }
            .games-container { max-width: 900px; }
            .game-card { padding: 2rem; min-height: 280px; }
            .sprite, .sprite svg { width: 96px; height: 96px; }
            h1 { font-size: 2.5rem; letter-spacing: 6px; }
            h2 { font-size: 1.8rem; }
            .press-start { font-size: 1.1rem; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                animation-delay: 0ms !important;
                transition-duration: 0.01ms !important;
            }
        }

    </style>
</head>
